services:
  api:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # MongoDB is hosted on Atlas — supply the URI via your shell/.env, do not commit it.
      MONGODB_URI: ${MONGODB_URI:-}
      PORT: "8000"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://doctar.in,http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      # "false" = Google Places / Gemini / deterministic-mock fallback chain is
      # active, so every search returns results even where the real MongoDB
      # collection has no matching doctor — current intent while the real
      # doctor database is still being populated. Switch to "true" once it has
      # real coverage, so only genuine listings are ever shown to patients.
      USE_REAL_DOCTOR_DB: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ./backend-node/uploads:/app/uploads
